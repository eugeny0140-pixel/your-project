services:
  - type: web
    name: telegram-news-bot
    runtime: python
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: DATABASE_URL
        sync: false
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    env: python
    plan: free
    healthCheckPath: /
    branch: main
